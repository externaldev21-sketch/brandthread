# Refund: the buyer requests a refund on a delivered order.
# ORDER_ID_TO_REFUND is a delivered order belonging to the signed-in buyer.
appId: com.brandthread.mobile
name: refund
---
- openLink: brandthread://buyer-refund-request?orderId=${ORDER_ID_TO_REFUND}
- extendedWaitUntil:
    visible: "Item damaged"
    timeout: 20000
- tapOn: "Item damaged"
- scrollUntilVisible:
    element: "Submit refund request"
- tapOn: "Submit refund request"
- extendedWaitUntil:
    visible: "Refund request submitted"
    timeout: 15000
