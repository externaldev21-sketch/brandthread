# Sign up as a buyer with an email account, through every onboarding step.
# Uses a Clerk test address (+clerk_test) so the code is always 424242.
# Only works against a Clerk *development* instance.
appId: com.brandthread.mobile
name: sign-up
env:
  EMAIL: e2e+clerk_test_${MAESTRO_RUN_ID}@example.com
  USERNAME: e2e_${MAESTRO_RUN_ID}
---
- clearState
- launchApp
- tapOn:
    id: onboarding-welcome-get-started
- tapOn: "I'm here to shop"
- tapOn: "Continue"
- tapOn:
    id: onboarding-email-input
- inputText: ${EMAIL}
- tapOn:
    id: onboarding-email-next
- extendedWaitUntil:
    visible:
      id: onboarding-code-input
    timeout: 15000
- tapOn:
    id: onboarding-code-input
- inputText: "424242"
- tapOn:
    id: onboarding-code-next
- tapOn:
    id: onboarding-password-input
- inputText: "Brandthread-e2e-1"
- tapOn:
    id: onboarding-password-next
# The birthday uses wheels, not the retired text input.
- tapOn:
    id: onboarding-birthday-year
- scrollUntilVisible:
    element: "1995"
    direction: UP
- tapOn: "1995"
- tapOn:
    id: onboarding-birthday-next
- tapOn:
    id: onboarding-terms-agree
- extendedWaitUntil:
    visible:
      id: onboarding-first-name-input
    timeout: 15000
- tapOn:
    id: onboarding-first-name-input
- inputText: "Jordan Tester"
- tapOn:
    id: onboarding-name-next
- tapOn:
    id: onboarding-username-input
- inputText: ${USERNAME}
- tapOn:
    id: onboarding-username-next
- hideKeyboard
- tapOn:
    id: onboarding-photo-skip
- tapOn:
    id: onboarding-welcome-user
# Personalization is optional; notifications are asked in context later.
- tapOn:
    id: onboarding-style-skip
- tapOn:
    id: onboarding-sizes-skip
- tapOn:
    id: onboarding-brands-skip
- extendedWaitUntil:
    visible: "Threads"
    timeout: 20000
- assertNotVisible:
    id: onboarding-email-input
