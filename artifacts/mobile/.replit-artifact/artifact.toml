kind = "mobile"
previewPath = "/"
title = "Brandthread"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/mobile/server/serve.js" ]

[services.production.run.env]
PORT = "18115"
BASE_PATH = "/"

[services.production.health.startup]
path = "/status"

[services.env]
PORT = "18115"
BASE_PATH = "/"
