kind = "slides"
previewPath = "/app-tour/"
title = "Brandthread App Tour"
version = "1.0.0"
id = "artifacts/app-tour"
router = "path"

[[services]]
name = "web"
paths = [ "/app-tour/" ]
localPort = 18205

[services.development]
run = "pnpm --filter @workspace/app-tour run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/app-tour", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/mobile/server/serve.js" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "18205"
BASE_PATH = "/app-tour"
EXPO_WEB_BUILD_DIR = "../app-tour/dist/public"

[services.production.health.startup]
path = "/status"

[services.env]
PORT = "18205"
BASE_PATH = "/app-tour/"
