kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# Besides /api, the server owns a few public, server-rendered paths
# (src/app.ts): short links, link-in-bio pages, giveaway shares, the DMCA /
# IP-notice form and the iOS/Android app-link verification files. Without
# them here the router sent those to the web app, which showed "not found".
paths = [
  "/api",
  "/l/",
  "/bio/",
  "/g/",
  "/dmca",
  "/legal/ip-notice",
  "/.well-known/",
  "/ws/",
]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
name = "fast-preview"
localPort = 18116
paths = [ "/fast-preview" ]
ensurePreviewReachable = "/fast-preview/status"

[services.development]
run = "bash -c 'if [ ! -f artifacts/mobile/static-preview-build/index.html ]; then pnpm --filter @workspace/mobile run preview:web:build || exit $?; fi; exec pnpm --filter @workspace/mobile run preview:web:serve'"

[services.env]
PORT = "18116"
BASE_PATH = "/fast-preview"
EXPO_WEB_BUILD_DIR = "static-preview-build"
