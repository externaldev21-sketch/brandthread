kind = "web"
previewPath = "/manufacturers/"
title = "Brandthread Manufacturer Portal"
version = "1.0.0"
id = "artifacts/manufacturer-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/manufacturers/" ]
localPort = 24728

[services.development]
run = "pnpm --filter @workspace/manufacturer-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manufacturer-portal", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/mobile/server/serve.js" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "24728"
BASE_PATH = "/manufacturers"
EXPO_WEB_BUILD_DIR = "../manufacturer-portal/dist/public"

[services.production.health.startup]
path = "/status"

[services.env]
PORT = "24728"
BASE_PATH = "/manufacturers/"
