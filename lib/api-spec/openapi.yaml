openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calls
    description: Secure voice and video call operations
  - name: manufacturers
    description: Manufacturer portal operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /call/token:
    post:
      operationId: createCallToken
      tags: [calls]
      summary: Create short-lived credentials for an authorized call participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenInput"
      responses:
        "200":
          description: Short-lived call credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallCredentials"
        "403":
          description: Caller is not a conversation participant
        "503":
          description: Secure calling is unavailable

  /call/availability:
    get:
      operationId: getCallAvailability
      tags: [calls]
      summary: Whether voice and video calling is configured on this server
      responses:
        "200":
          description: Call availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallAvailability"

  /call/token/renew:
    post:
      operationId: renewCallToken
      tags: [calls]
      summary: Renew credentials after re-authorizing the same manufacturer thread participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenRenewalInput"
      responses:
        "200":
          description: Renewed short-lived call credentials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CallCredentials"
                  - type: object
                    required: [renewed, duplicate]
                    properties:
                      renewed: { type: boolean, const: true }
                      duplicate: { type: boolean }
        "403":
          description: Caller is no longer a manufacturer thread participant
        "503":
          description: Secure call renewal failed

  /drops/{id}/broadcast-preview:
    get:
      operationId: getDropBroadcastPreview
      tags: [drops]
      summary: Preview the audience for a drop notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Number of unique recipients who would receive the notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropBroadcastPreview"
        "404":
          description: Drop not found

  # ── Manufacturer registration & profile ───────────────────────────────────────

  /manufacturers/me:
    get:
      operationId: getMyManufacturerProfile
      tags: [manufacturers]
      summary: Get current manufacturer's profile
      responses:
        "200":
          description: Manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "404":
          description: Not registered yet

    patch:
      operationId: updateMyManufacturerProfile
      tags: [manufacturers]
      summary: Update manufacturer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"

  /manufacturers/me/photos:
    patch:
      operationId: reorderMyManufacturerPhotos
      tags: [manufacturers]
      summary: Reorder current manufacturer's factory photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPhotoReorder"
      responses:
        "200":
          description: Updated manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "409":
          description: Profile changed since it was loaded

  /manufacturers/me/photos/{photoIndex}:
    delete:
      operationId: deleteMyManufacturerPhoto
      tags: [manufacturers]
      summary: Delete a factory photo from the current manufacturer's profile
      parameters:
        - name: photoIndex
          in: path
          required: true
          description: Zero-based index from the latest manufacturer profile revision.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPhotoDelete"
      responses:
        "200":
          description: Updated manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "409":
          description: Profile changed since it was loaded

  /manufacturers/register:
    post:
      operationId: registerManufacturer
      tags: [manufacturers]
      summary: Register as a manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"

  /manufacturers/public:
    get:
      operationId: listPublicManufacturers
      tags: [manufacturers]
      summary: List approved public manufacturer profiles
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: specialty, in: query, schema: { type: string } }
        - { name: minYears, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxMoq, in: query, schema: { type: integer, minimum: 1 } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: hasPhotos, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, newest, experience, rating, moq] } }
      responses:
        "200":
          description: Approved directory profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicManufacturer" }

  /manufacturers/public/facets:
    get:
      operationId: getManufacturerDirectoryFacets
      tags: [manufacturers]
      summary: Countries and specialties present in the live public directory, with counts
      responses:
        "200":
          description: Directory facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerDirectoryFacets" }

  /manufacturers/public/{manufacturerId}:
    get:
      operationId: getPublicManufacturer
      tags: [manufacturers]
      parameters:
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved directory profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicManufacturer" }

  /manufacturers/public/apply:
    post:
      operationId: applyAsManufacturer
      tags: [manufacturers]
      summary: Submit an unauthenticated application for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerApplicationInput" }
      responses:
        "202":
          description: Application accepted but not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerApplicationReceipt" }

  /manufacturers/invite-tokens/resolve/{token}:
    get:
      operationId: resolveManufacturerInvite
      tags: [manufacturers]
      summary: Look up a private seller invite before signing up
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Valid invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerInviteResolution" }
        "404":
          description: Unknown invite
        "410":
          description: Invite already used

  /manufacturers/register-via-invite/{token}:
    post:
      operationId: registerManufacturerViaInvite
      tags: [manufacturers]
      summary: Register (or link an existing profile) through a seller's private invite
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerInput" }
      responses:
        "201":
          description: Registered privately and connected to the inviting seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerInviteRegistration" }
        "200":
          description: Existing profile connected to the inviting seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerInviteRegistration" }

  /manufacturers/me/threads/{threadId}/order-cards:
    post:
      operationId: sendManufacturerOrderCard
      tags: [manufacturers]
      summary: Price a sample or bulk order and send it to the seller as a payable card in chat
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCardInput" }
      responses:
        "201":
          description: Card created and posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderCardResult" }
        "200":
          description: Idempotent replay of the same card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderCardResult" }
        "422":
          description: Invalid card fields

  /manufacturers/orders/{orderId}/timeline:
    get:
      operationId: getManufacturerOrderTimeline
      tags: [manufacturers]
      summary: Six-stage tracker with stage timestamps and shipment tracking, for either participant
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Order timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTimeline" }

  /manufacturers/orders/{orderId}/cancel:
    post:
      operationId: cancelManufacturerOrderCard
      tags: [manufacturers]
      summary: Withdraw (manufacturer) or decline (seller) an unpaid order card
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCardCancelInput" }
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }
        "409":
          description: Order is paid, paying, or already closed

  /manufacturers/orders/{orderId}/confirm-delivery:
    post:
      operationId: confirmManufacturerOrderDelivery
      tags: [manufacturers]
      summary: Seller confirms a shipped order arrived
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Delivered order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /manufacturers/partners/{manufacturerId}:
    get:
      operationId: getPartnerManufacturer
      tags: [manufacturers]
      summary: Seller-scoped profile for a public manufacturer or a private one the seller is connected to
      parameters:
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Manufacturer profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PublicManufacturer"
                  - type: object
                    required: [isConnected, isPublicDirectory]
                    properties:
                      isConnected: { type: boolean }
                      isPublicDirectory: { type: boolean }
        "404":
          description: Not found or not connected

  /manufacturers/relationships:
    get:
      operationId: listManufacturerRelationships
      tags: [manufacturers]
      summary: List relationships for the authenticated seller
      responses:
        "200":
          description: Seller relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerRelationship" }
    post:
      operationId: createManufacturerRelationship
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerRelationshipInput" }
      responses:
        "201":
          description: Existing or newly-created relationship
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerRelationship" }

  /manufacturers/me/relationships:
    get:
      operationId: listMyManufacturerRelationships
      tags: [manufacturers]
      summary: List relationships for the authenticated manufacturer
      responses:
        "200":
          description: Manufacturer relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerRelationship" }

  /manufacturers/threads:
    get:
      operationId: listSellerManufacturerThreads
      tags: [manufacturers]
      responses:
        "200":
          description: Authenticated seller threads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageThread" }
    post:
      operationId: createManufacturerThread
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerThreadInput" }
      responses:
        "201":
          description: Existing or newly-created canonical thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageThread" }

  /manufacturers/threads/{threadId}/messages:
    get:
      operationId: getSellerManufacturerThreadMessages
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Participant-authorized messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendSellerManufacturerThreadMessage
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Idempotently accepted message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /manufacturers/threads/{threadId}/attachments:
    post:
      operationId: uploadSellerManufacturerThreadAttachment
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Private participant-bound attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentReceipt" }

  /manufacturers/me/dashboard:
    get:
      operationId: getManufacturerDashboard
      tags: [manufacturers]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerDashboard"

  # ── Messages ──────────────────────────────────────────────────────────────────

  /manufacturers/me/threads:
    get:
      operationId: listManufacturerThreads
      tags: [manufacturers]
      summary: List all message threads
      responses:
        "200":
          description: Message threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"

  /manufacturers/me/threads/{threadId}/messages:
    get:
      operationId: getThreadMessages
      tags: [manufacturers]
      summary: Get messages in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

    post:
      operationId: sendThreadMessage
      tags: [manufacturers]
      summary: Send a reply in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /manufacturers/me/threads/{threadId}/attachments:
    post:
      operationId: uploadManufacturerThreadAttachment
      tags: [manufacturers]
      summary: Upload an image or PDF for an authorized manufacturer thread
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Private attachment stored
          content:
            application/json:
              schema:
                type: object
                required: [objectPath]
                properties:
                  objectPath: { type: string }

  # ── Sample / Production Orders ────────────────────────────────────────────────

  /manufacturers/me/sample-orders:
    get:
      operationId: listManufacturerSampleOrders
      tags: [manufacturers]
      responses:
        "200":
          description: Shared sample and bulk orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SampleOrder" }

  /manufacturers/me/sample-orders/{orderId}:
    get:
      operationId: getManufacturerSampleOrder
      tags: [manufacturers]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shared order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /manufacturers/me/sample-orders/{orderId}/status:
    patch:
      operationId: advanceManufacturerSampleOrder
      tags: [manufacturers]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerSampleOrderStatusUpdate" }
      responses:
        "200":
          description: Updated shared order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/pay:
    post:
      operationId: confirmSampleOrderPayment
      tags: [manufacturers]
      summary: Confirm a seller-owned sample order's succeeded Stripe payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Confirmed payment and activated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }
        "409":
          description: Payment has not succeeded or no Stripe payment exists

  /sample-orders:
    get:
      operationId: listSellerProductionOrders
      tags: [manufacturers]
      responses:
        "200":
          description: Seller-owned sample and bulk orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SampleOrder" }
    post:
      operationId: createProductionOrder
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductionOrderInput" }
      responses:
        "201":
          description: Idempotently created sample or bulk order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}:
    get:
      operationId: getProductionOrder
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Participant-authorized order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/sample-detail:
    patch:
      operationId: updateSampleOrderDetail
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleDetailDecisionInput" }
      responses:
        "200":
          description: Seller decision applied to a delivered sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/images/upload:
    post:
      operationId: uploadSampleOrderImage
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Atomically attached private image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrderImageUploadReceipt" }

  /sample-orders/{id}/checkout-session:
    post:
      operationId: createSampleOrderCheckoutSession
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCheckoutSessionInput" }
      responses:
        "201":
          description: Reusable hosted Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCheckoutSession" }

  /sample-orders/{id}/payment-options:
    get:
      operationId: getBulkOrderPaymentOptions
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Eligible seller drop wallets for pending bulk payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPaymentOptions" }

  /sample-orders/{id}/pay-from-wallet:
    post:
      operationId: payBulkOrderFromWallet
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkWalletPaymentInput" }
      responses:
        "200":
          description: Wallet payment reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  # ── Payment setup ─────────────────────────────────────────────────────────────

  /manufacturers/me/payment:
    get:
      operationId: getManufacturerPayment
      tags: [manufacturers]
      summary: Get payment setup status
      responses:
        "200":
          description: Payment info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerPayment"
    post:
      operationId: setupManufacturerPayment
      tags: [manufacturers]
      summary: Set up payment / payout details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPaymentInput"
      responses:
        "200":
          description: Payment configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerPayment"

  /manufacturers/connect/status:
    get:
      operationId: getManufacturerConnectStatus
      tags: [manufacturers]
      responses:
        "200":
          description: Stripe Connect readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerConnectStatus" }

  /manufacturers/connect/onboard:
    post:
      operationId: createManufacturerConnectOnboarding
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerConnectOnboardingInput" }
      responses:
        "200":
          description: Stripe-hosted onboarding URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerConnectOnboarding" }

  /manufacturers/connect/payments:
    get:
      operationId: listManufacturerPaymentActivity
      tags: [manufacturers]
      responses:
        "200":
          description: Idempotently reconciled payment and payout activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerPaymentActivity" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CallTokenInput:
      type: object
      required: [conversationId, mode]
      properties:
        conversationId: { type: string }
        threadId: { type: string }
        mode: { type: string, enum: [voice, video] }

    CallTokenRenewalInput:
      type: object
      required: [threadId, mode, clientRenewalId]
      properties:
        threadId: { type: string, format: uuid }
        mode: { type: string, enum: [voice, video] }
        clientRenewalId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"

    CallCredentials:
      type: object
      required: [appId, token, channelName, uid, mode, expiresAt]
      properties:
        appId: { type: string }
        token: { type: string }
        channelName: { type: string }
        uid: { type: integer, minimum: 1 }
        mode: { type: string, enum: [voice, video] }
        expiresAt: { type: string, format: date-time }

    CallAvailability:
      type: object
      required: [configured, provider]
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [agora] }

    DropBroadcastPreview:
      type: object
      required: [followers]
      properties:
        followers: { type: integer, minimum: 0 }

    # ── Manufacturer ─────────────────────────────────────────────────────────────

    Manufacturer:
      type: object
      required: [id, clerkId, businessName, country, specialty, moq, priceRange, bulkTurnaround, sampleTurnaround, status, createdAt, updatedAt, revision]
      properties:
        id:               { type: string }
        clerkId:          { type: string }
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: ["string", "null"] }
        specialty:        { type: string }
        description:      { type: ["string", "null"] }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        photos:
          type: array
          items: { type: string, format: uri }
        website:          { type: ["string", "null"] }
        contactEmail:     { type: ["string", "null"] }
        contactPhone:     { type: ["string", "null"] }
        timeZone:         { type: ["string", "null"] }
        isPublicDirectory: { type: boolean }
        status:           { type: string }
        verifiedAt:       { type: ["string", "null"] }
        paymentSetup:     { type: boolean }
        createdAt:        { type: string }
        updatedAt:        { type: string }
        revision:         { type: integer, minimum: 1 }

    ManufacturerInput:
      type: object
      required: [businessName, country, specialty, moq, priceRange, bulkTurnaround, sampleTurnaround]
      properties:
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: string }
        specialty:        { type: string }
        description:      { type: string }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        website:          { type: string }
        contactEmail:     { type: string }
        contactPhone:     { type: string }
        timeZone:         { type: string, maxLength: 64 }

    ManufacturerUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: string }
        specialty:        { type: string }
        description:      { type: string }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        website:          { type: string }
        contactEmail:     { type: string }
        contactPhone:     { type: string }
        timeZone:         { type: string, maxLength: 64 }
        isPublicDirectory: { type: boolean }

    ManufacturerPhotoReorder:
      type: object
      required: [expectedRevision, photoOrder]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        photoOrder:
          type: array
          description: Complete zero-based permutation of the current photo list; index zero becomes the lead image.
          items: { type: integer }
          uniqueItems: true

    ManufacturerPhotoDelete:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }

    PublicManufacturer:
      type: object
      additionalProperties: false
      required: [id, businessName, country, specialty, yearsInBusiness, moq, priceRange, bulkTurnaround, sampleTurnaround, photos, isVerified, createdAt, updatedAt, revision]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        country: { type: string }
        city: { type: ["string", "null"] }
        specialty: { type: string }
        description: { type: ["string", "null"] }
        yearsInBusiness: { type: integer }
        moq: { type: integer }
        priceRange: { type: string }
        bulkTurnaround: { type: string }
        sampleTurnaround: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
        website: { type: ["string", "null"] }
        timeZone: { type: ["string", "null"] }
        isVerified: { type: boolean }
        rating: { type: ["number", "null"] }
        reviewCount: { type: integer }
        responseTime: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }

    ManufacturerDirectoryFacets:
      type: object
      required: [total, countries, specialties]
      properties:
        total: { type: integer }
        countries:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        specialties:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }

    ManufacturerInviteResolution:
      type: object
      required: [valid, sellerName]
      properties:
        valid: { type: boolean }
        sellerName: { type: string }
        companyName: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }

    ManufacturerInviteRegistration:
      allOf:
        - $ref: "#/components/schemas/Manufacturer"
        - type: object
          required: [invitedBySellerId, threadId]
          properties:
            invitedBySellerId: { type: string }
            threadId: { type: string, format: uuid }

    OrderCardInput:
      type: object
      required: [clientRequestId, orderType, title, quantity, priceCents]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 100 }
        orderType: { type: string, enum: [sample, bulk] }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"], maxLength: 2000 }
        quantity: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 100 }

    OrderCardCancelInput:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    OrderCardResult:
      type: object
      required: [order, message]
      properties:
        order: { $ref: "#/components/schemas/SampleOrder" }
        message: { $ref: "#/components/schemas/Message" }

    OrderCardSnapshot:
      type: object
      required: [id, orderType, title, quantity, priceCents, status, revision, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderType: { type: string, enum: [sample, bulk] }
        title: { type: string }
        description: { type: ["string", "null"] }
        quantity: { type: integer }
        priceCents: { type: integer }
        currency: { type: string }
        status: { type: string }
        issuedBy: { type: string }
        carrier: { type: ["string", "null"] }
        trackingNumber: { type: ["string", "null"] }
        paymentReviewState: { type: string }
        manufacturerPayoutReady: { type: boolean }
        revision: { type: integer }
        updatedAt: { type: string, format: date-time }

    OrderTimelineStep:
      type: object
      required: [stage, label, description, state, at]
      properties:
        stage: { type: string, enum: [payment_received, processing, cut_and_sew, packing, shipped, delivered] }
        label: { type: string }
        description: { type: string }
        state: { type: string, enum: [done, current, upcoming] }
        at: { type: ["string", "null"], format: date-time }

    OrderTimelineEvent:
      type: object
      required: [id, actorRole, toStatus, createdAt]
      properties:
        id: { type: string }
        actorRole: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    OrderTimeline:
      type: object
      required: [order, steps, events, tracking, viewerRole]
      properties:
        viewerRole: { type: string, enum: [seller, manufacturer] }
        order: { $ref: "#/components/schemas/OrderCardSnapshot" }
        manufacturer:
          type: object
          required: [id, businessName, country]
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }
            country: { type: string }
            timeZone: { type: ["string", "null"] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/OrderTimelineStep" }
        events:
          type: array
          items: { $ref: "#/components/schemas/OrderTimelineEvent" }
        createdAt: { type: string, format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        tracking:
          type: object
          required: [carrier, carrierName, trackingNumber, url]
          properties:
            carrier: { type: ["string", "null"] }
            carrierName: { type: ["string", "null"] }
            trackingNumber: { type: ["string", "null"] }
            url: { type: ["string", "null"] }

    ManufacturerApplicationInput:
      allOf:
        - $ref: "#/components/schemas/ManufacturerInput"
        - type: object
          required: [clientRequestId]
          properties:
            clientRequestId: { type: string, minLength: 1, maxLength: 100 }

    ManufacturerApplicationReceipt:
      type: object
      required: [id, status, published]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        published: { type: boolean, const: false }

    ManufacturerRelationshipInput:
      type: object
      required: [manufacturerId]
      properties:
        manufacturerId: { type: string, format: uuid }

    ManufacturerRelationship:
      type: object
      required: [id, sellerId, manufacturerId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string }
        manufacturerId: { type: string, format: uuid }
        status: { type: string, enum: [active, blocked, ended] }
        manufacturer: { $ref: "#/components/schemas/PublicManufacturer" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ManufacturerThreadInput:
      type: object
      required: [manufacturerId]
      properties:
        manufacturerId: { type: string, format: uuid }
        subject: { type: string, maxLength: 200 }

    ManufacturerDashboard:
      type: object
      required: [activeOrders, pendingMessages, completedOrders, totalRevenueCents, recentOrders, activeSellers, messages, sampleOrders, bulkOrders, orderHistory]
      properties:
        activeOrders:        { type: integer }
        pendingMessages:     { type: integer }
        completedOrders:     { type: integer }
        totalRevenueCents:   { type: integer }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/SampleOrder"
        activeSellers:
          type: array
          items: { type: object, additionalProperties: true }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageThread" }
        sampleOrders: { $ref: "#/components/schemas/OrderBuckets" }
        bulkOrders: { $ref: "#/components/schemas/OrderBuckets" }
        orderHistory:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }

    # ── Messages ──────────────────────────────────────────────────────────────────

    MessageThread:
      type: object
      required: [id, manufacturerId, sellerId, buyerName, subject, lastMessage, lastMessageAt, unreadCount]
      properties:
        id:             { type: string }
        manufacturerId: { type: string, format: uuid }
        sellerId:       { type: string }
        buyerName:      { type: string }
        buyerAvatar:    { type: ["string", "null"] }
        subject:        { type: string }
        lastMessage:    { type: string }
        lastMessageAt:  { type: string }
        unreadCount:    { type: integer }
        orderStatus:    { type: ["string", "null"] }

    Message:
      type: object
      required: [id, threadId, senderRole, senderId, content, messageType, mediaUrls, sentAt]
      properties:
        id:          { type: string }
        threadId:    { type: string }
        senderRole:  { type: string }
        senderId:    { type: string }
        content:     { type: string }
        messageType: { type: string, enum: [text, image, sample_card, bulk_card, system] }
        mediaUrls: { type: array, items: { type: string } }
        cardData: { type: ["object", "null"], additionalProperties: true }
        order:
          description: Live state of the order a sample/bulk card refers to.
          oneOf:
            - $ref: "#/components/schemas/OrderCardSnapshot"
            - type: "null"
        sentAt:      { type: string }

    MessageInput:
      type: object
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string }
        messageType: { type: string, enum: [text, image, sample_card, bulk_card, system] }
        mediaUrls:
          type: array
          items: { type: string }
        cardData: { type: ["object", "null"], additionalProperties: true }

    AttachmentReceipt:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, pattern: "^/objects/" }

    # ── Orders ────────────────────────────────────────────────────────────────────

    SampleOrder:
      type: object
      additionalProperties: true
      required: [id, manufacturerId, sellerId, orderType, title, quantity, priceCents, status, createdAt, updatedAt, revision]
      properties:
        id: { type: string }
        manufacturerId: { type: string }
        sellerId: { type: string }
        sellerName: { type: string, description: "Seller brand name (manufacturer-facing endpoints)" }
        threadId: { type: ["string", "null"] }
        orderType: { type: string, enum: [sample, bulk] }
        issuedBy: { type: string, enum: [seller, manufacturer] }
        title: { type: string }
        description: { type: ["string", "null"] }
        quantity: { type: integer }
        priceCents: { type: integer }
        status: { type: string }
        carrier: { type: ["string", "null"] }
        trackingNumber: { type: ["string", "null"] }
        shippedAt: { type: ["string", "null"] }
        deliveredAt: { type: ["string", "null"] }
        imageUrls:
          type: array
          description: Short-lived display URLs returned only to an authorized order participant; private object paths are never returned by detail endpoints.
          items: { type: string, format: uri }
        createdAt: { type: string }
        updatedAt: { type: string }
        revision: { type: integer, minimum: 1 }

    ProductionOrderInput:
      type: object
      required: [clientRequestId, manufacturerId, orderType, title, quantity, priceCents]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 100 }
        manufacturerId: { type: string, format: uuid }
        threadId: { type: ["string", "null"], format: uuid }
        orderType: { type: string, enum: [sample, bulk] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
        quantity: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }

    SampleDetailDecisionInput:
      type: object
      required: [status, expectedRevision]
      properties:
        status: { type: string, enum: [approved, rejected, revision_requested] }
        expectedRevision: { type: integer, minimum: 1 }
        review: { type: object, additionalProperties: true }
        revision: { type: object, additionalProperties: true }

    SampleOrderImageUploadReceipt:
      type: object
      required: [imageUrls, revision]
      properties:
        imageUrls:
          type: array
          items: { type: string, format: uri }
        revision: { type: integer, minimum: 1 }

    OrderBuckets:
      type: object
      required: [active, completed]
      properties:
        active:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }

    ManufacturerSampleOrderStatusUpdate:
      type: object
      required: [status, expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        status: { type: string, enum: [processing, cut_and_sew, packing, shipped, delivered] }
        trackingNumber: { type: string }
        carrier: { type: string }

    SampleCheckoutSession:
      type: object
      required: [sessionId, paymentStatus]
      properties:
        sessionId: { type: string }
        url: { type: ["string", "null"] }
        paymentStatus: { type: string }

    SampleCheckoutSessionInput:
      type: object
      required: [returnUrl]
      properties: { returnUrl: { type: string } }

    BulkWalletPaymentInput:
      type: object
      required: [walletId]
      properties: { walletId: { type: string } }

    BulkPaymentOptions:
      type: object
      required: [orderId, requiredCents, wallets]
      properties:
        orderId: { type: string }
        requiredCents: { type: integer }
        wallets:
          type: array
          items:
            type: object
            required: [id, dropId, availableCents, eligible]
            properties:
              id: { type: string }
              dropId: { type: string }
              availableCents: { type: integer }
              eligible: { type: boolean }

    # ── Payment ───────────────────────────────────────────────────────────────────

    ManufacturerPayment:
      type: object
      required: [isSetup, method]
      properties:
        isSetup:     { type: boolean }
        method:      { type: ["string", "null"] }
        bankLast4:   { type: ["string", "null"] }
        bankName:    { type: ["string", "null"] }
        currency:    { type: ["string", "null"] }
        setupAt:     { type: ["string", "null"] }

    ManufacturerPaymentInput:
      type: object
      required: [method, accountNumber, routingNumber, bankName, currency]
      properties:
        method:        { type: string }
        accountNumber: { type: string }
        routingNumber: { type: string }
        bankName:      { type: string }
        currency:      { type: string }
        paypalEmail:   { type: string }
        wiseEmail:     { type: string }

    ManufacturerConnectStatus:
      type: object
      required: [connected, ready, status, chargesEnabled, payoutsEnabled, detailsSubmitted, requirementsDue]
      properties:
        connected: { type: boolean }
        ready: { type: boolean }
        status: { type: string, enum: [not_started, pending, restricted, active] }
        stripeAccountId: { type: string }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        detailsSubmitted: { type: boolean }
        requirementsDue: { type: array, items: { type: string } }
        disabledReason: { type: ["string", "null"] }
        recovery: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        payoutCurrency: { type: ["string", "null"] }
        accountType: { type: ["string", "null"], enum: [full, recipient, null] }

    ManufacturerConnectOnboardingInput:
      type: object
      required: [refreshUrl, returnUrl]
      properties:
        refreshUrl: { type: string, format: uri }
        returnUrl: { type: string, format: uri }

    ManufacturerConnectOnboarding:
      type: object
      required: [url, stripeAccountId]
      properties:
        url: { type: string, format: uri }
        stripeAccountId: { type: string }

    ManufacturerPaymentActivity:
      type: object
      required: [id, manufacturerId, category, type, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        manufacturerId: { type: string, format: uuid }
        sampleOrderId: { type: ["string", "null"], format: uuid }
        category: { type: string, enum: [payment, payout] }
        type: { type: string }
        amountCents: { type: ["integer", "null"] }
        orderTitle: { type: ["string", "null"] }
        orderType: { type: ["string", "null"], enum: [sample, bulk, null] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
