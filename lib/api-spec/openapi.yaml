openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calls
    description: Secure voice and video call operations
  - name: manufacturers
    description: Manufacturer portal operations
  - name: safety
    description: Comments, reports, blocks and muted words (App Store guideline 1.2)
  - name: moderation
    description: Moderator review queue and enforcement actions
  - name: account
    description: Account deletion, legal acceptance and sign-in sessions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /call/token:
    post:
      operationId: createCallToken
      tags: [calls]
      summary: Create short-lived credentials for an authorized call participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenInput"
      responses:
        "200":
          description: Short-lived call credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallCredentials"
        "403":
          description: Caller is not a conversation participant
        "503":
          description: Secure calling is unavailable

  /call/token/renew:
    post:
      operationId: renewCallToken
      tags: [calls]
      summary: Renew credentials after re-authorizing the same manufacturer thread participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallTokenRenewalInput"
      responses:
        "200":
          description: Renewed short-lived call credentials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CallCredentials"
                  - type: object
                    required: [renewed, duplicate]
                    properties:
                      renewed: { type: boolean, const: true }
                      duplicate: { type: boolean }
        "403":
          description: Caller is no longer a manufacturer thread participant
        "503":
          description: Secure call renewal failed

  /drops/{id}/broadcast-preview:
    get:
      operationId: getDropBroadcastPreview
      tags: [drops]
      summary: Preview the audience for a drop notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Number of unique recipients who would receive the notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropBroadcastPreview"
        "404":
          description: Drop not found

  # ── Manufacturer registration & profile ───────────────────────────────────────

  /manufacturers/me:
    get:
      operationId: getMyManufacturerProfile
      tags: [manufacturers]
      summary: Get current manufacturer's profile
      responses:
        "200":
          description: Manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "404":
          description: Not registered yet

    patch:
      operationId: updateMyManufacturerProfile
      tags: [manufacturers]
      summary: Update manufacturer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"

  /manufacturers/me/photos:
    patch:
      operationId: reorderMyManufacturerPhotos
      tags: [manufacturers]
      summary: Reorder current manufacturer's factory photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPhotoReorder"
      responses:
        "200":
          description: Updated manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "409":
          description: Profile changed since it was loaded

  /manufacturers/me/photos/{photoIndex}:
    delete:
      operationId: deleteMyManufacturerPhoto
      tags: [manufacturers]
      summary: Delete a factory photo from the current manufacturer's profile
      parameters:
        - name: photoIndex
          in: path
          required: true
          description: Zero-based index from the latest manufacturer profile revision.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPhotoDelete"
      responses:
        "200":
          description: Updated manufacturer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"
        "409":
          description: Profile changed since it was loaded

  /manufacturers/register:
    post:
      operationId: registerManufacturer
      tags: [manufacturers]
      summary: Register as a manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manufacturer"

  /manufacturers/public:
    get:
      operationId: listPublicManufacturers
      tags: [manufacturers]
      summary: List approved public manufacturer profiles
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: specialty, in: query, schema: { type: string } }
      responses:
        "200":
          description: Approved directory profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicManufacturer" }

  /manufacturers/public/{manufacturerId}:
    get:
      operationId: getPublicManufacturer
      tags: [manufacturers]
      parameters:
        - { name: manufacturerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved directory profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicManufacturer" }

  /manufacturers/public/apply:
    post:
      operationId: applyAsManufacturer
      tags: [manufacturers]
      summary: Submit an unauthenticated application for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerApplicationInput" }
      responses:
        "202":
          description: Application accepted but not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerApplicationReceipt" }

  /manufacturers/relationships:
    get:
      operationId: listManufacturerRelationships
      tags: [manufacturers]
      summary: List relationships for the authenticated seller
      responses:
        "200":
          description: Seller relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerRelationship" }
    post:
      operationId: createManufacturerRelationship
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerRelationshipInput" }
      responses:
        "201":
          description: Existing or newly-created relationship
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerRelationship" }

  /manufacturers/me/relationships:
    get:
      operationId: listMyManufacturerRelationships
      tags: [manufacturers]
      summary: List relationships for the authenticated manufacturer
      responses:
        "200":
          description: Manufacturer relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerRelationship" }

  /manufacturers/threads:
    get:
      operationId: listSellerManufacturerThreads
      tags: [manufacturers]
      responses:
        "200":
          description: Authenticated seller threads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageThread" }
    post:
      operationId: createManufacturerThread
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerThreadInput" }
      responses:
        "201":
          description: Existing or newly-created canonical thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageThread" }

  /manufacturers/threads/{threadId}/messages:
    get:
      operationId: getSellerManufacturerThreadMessages
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Participant-authorized messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: sendSellerManufacturerThreadMessage
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Idempotently accepted message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /manufacturers/threads/{threadId}/attachments:
    post:
      operationId: uploadSellerManufacturerThreadAttachment
      tags: [manufacturers]
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Private participant-bound attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentReceipt" }

  /manufacturers/me/dashboard:
    get:
      operationId: getManufacturerDashboard
      tags: [manufacturers]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerDashboard"

  # ── Messages ──────────────────────────────────────────────────────────────────

  /manufacturers/me/threads:
    get:
      operationId: listManufacturerThreads
      tags: [manufacturers]
      summary: List all message threads
      responses:
        "200":
          description: Message threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"

  /manufacturers/me/threads/{threadId}/messages:
    get:
      operationId: getThreadMessages
      tags: [manufacturers]
      summary: Get messages in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

    post:
      operationId: sendThreadMessage
      tags: [manufacturers]
      summary: Send a reply in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /manufacturers/me/threads/{threadId}/attachments:
    post:
      operationId: uploadManufacturerThreadAttachment
      tags: [manufacturers]
      summary: Upload an image or PDF for an authorized manufacturer thread
      parameters:
        - { name: threadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Private attachment stored
          content:
            application/json:
              schema:
                type: object
                required: [objectPath]
                properties:
                  objectPath: { type: string }

  # ── Sample / Production Orders ────────────────────────────────────────────────

  /manufacturers/me/sample-orders:
    get:
      operationId: listManufacturerSampleOrders
      tags: [manufacturers]
      responses:
        "200":
          description: Shared sample and bulk orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SampleOrder" }

  /manufacturers/me/sample-orders/{orderId}:
    get:
      operationId: getManufacturerSampleOrder
      tags: [manufacturers]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shared order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /manufacturers/me/sample-orders/{orderId}/status:
    patch:
      operationId: advanceManufacturerSampleOrder
      tags: [manufacturers]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerSampleOrderStatusUpdate" }
      responses:
        "200":
          description: Updated shared order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/pay:
    post:
      operationId: confirmSampleOrderPayment
      tags: [manufacturers]
      summary: Confirm a seller-owned sample order's succeeded Stripe payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Confirmed payment and activated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }
        "409":
          description: Payment has not succeeded or no Stripe payment exists

  /sample-orders:
    get:
      operationId: listSellerProductionOrders
      tags: [manufacturers]
      responses:
        "200":
          description: Seller-owned sample and bulk orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SampleOrder" }
    post:
      operationId: createProductionOrder
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductionOrderInput" }
      responses:
        "201":
          description: Idempotently created sample or bulk order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}:
    get:
      operationId: getProductionOrder
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Participant-authorized order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/sample-detail:
    patch:
      operationId: updateSampleOrderDetail
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleDetailDecisionInput" }
      responses:
        "200":
          description: Seller decision applied to a delivered sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  /sample-orders/{id}/images/upload:
    post:
      operationId: uploadSampleOrderImage
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Atomically attached private image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrderImageUploadReceipt" }

  /sample-orders/{id}/checkout-session:
    post:
      operationId: createSampleOrderCheckoutSession
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCheckoutSessionInput" }
      responses:
        "201":
          description: Reusable hosted Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCheckoutSession" }

  /sample-orders/{id}/payment-options:
    get:
      operationId: getBulkOrderPaymentOptions
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Eligible seller drop wallets for pending bulk payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPaymentOptions" }

  /sample-orders/{id}/pay-from-wallet:
    post:
      operationId: payBulkOrderFromWallet
      tags: [manufacturers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkWalletPaymentInput" }
      responses:
        "200":
          description: Wallet payment reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrder" }

  # ── Payment setup ─────────────────────────────────────────────────────────────

  /manufacturers/me/payment:
    get:
      operationId: getManufacturerPayment
      tags: [manufacturers]
      summary: Get payment setup status
      responses:
        "200":
          description: Payment info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerPayment"
    post:
      operationId: setupManufacturerPayment
      tags: [manufacturers]
      summary: Set up payment / payout details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManufacturerPaymentInput"
      responses:
        "200":
          description: Payment configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerPayment"

  /manufacturers/connect/status:
    get:
      operationId: getManufacturerConnectStatus
      tags: [manufacturers]
      responses:
        "200":
          description: Stripe Connect readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerConnectStatus" }

  /manufacturers/connect/onboard:
    post:
      operationId: createManufacturerConnectOnboarding
      tags: [manufacturers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturerConnectOnboardingInput" }
      responses:
        "200":
          description: Stripe-hosted onboarding URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerConnectOnboarding" }

  /manufacturers/connect/payments:
    get:
      operationId: listManufacturerPaymentActivity
      tags: [manufacturers]
      responses:
        "200":
          description: Idempotently reconciled payment and payout activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManufacturerPaymentActivity" }

  # ── Trust & safety (App Store 1.2) ──────────────────────────────────────────

  /posts/{postId}/comments:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listPostComments
      tags: [safety]
      summary: List comments; hides blocked people, muted words and held comments (except the viewer's own)
      description: Pages of 50 top-level comments, newest first. Pass `?before=<nextCursor>` for the next page.
      responses:
        "200":
          description: Comment thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentThread" }
        "404": { description: Post not found or hidden by a block }
    post:
      operationId: createPostComment
      tags: [safety]
      summary: Comment or reply. Slurs/threats are rejected; profanity and abuse are held for review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentInput" }
      responses:
        "201":
          description: Created (possibly held for review)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedComment" }
        "403": { description: "Comments disabled, blocked, or account suspended" }
        "422":
          description: Rejected by the content filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRejected" }

  /posts/{postId}/comments/{commentId}:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deletePostComment
      tags: [safety]
      summary: Delete a comment (author or post owner)
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "403": { description: Not the author or post owner }

  /posts/{postId}/comments/{commentId}/like:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: likePostComment
      tags: [safety]
      summary: Like or unlike a comment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LikeCommentInput" }
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                type: object
                required: [liked, likesCount]
                properties:
                  liked: { type: boolean }
                  likesCount: { type: integer, minimum: 0 }

  /reports:
    post:
      operationId: createReport
      tags: [safety]
      summary: Report a post, video, live stream, comment, story, product, profile or DM
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportInput" }
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "200":
          description: The same person already has an open report on this item
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [already_reported] }
                  id: { type: string, format: uuid }
        "400": { description: "Invalid reason, missing note for \"other\", or self-report" }
        "404": { description: Content not found }

  /moderation/me:
    get:
      operationId: getModerationAccess
      tags: [moderation]
      summary: Whether the signed-in person can review reports
      responses:
        "200":
          description: Moderator flag
          content:
            application/json:
              schema:
                type: object
                required: [isModerator]
                properties:
                  isModerator: { type: boolean }

  /moderation/reports:
    get:
      operationId: listModerationReports
      tags: [moderation]
      summary: Review queue (moderators only)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, resolved, all] } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/ReportTargetType" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationQueue" }
        "403": { description: Moderator access required }

  /moderation/reports/{reportId}/resolve:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveModerationReport
      tags: [moderation]
      summary: Dismiss, remove the content, or suspend the owner. Resolves every open report on the same item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveReportInput" }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveReportResult" }
        "403": { description: Moderator access required }

  /moderation/users/{userId}/reinstate:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      operationId: reinstateUser
      tags: [moderation]
      summary: Lift a suspension
      responses:
        "200": { description: Reinstated, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }

  /safety/muted-words:
    get:
      operationId: listMutedWords
      tags: [safety]
      summary: My muted words and phrases
      responses:
        "200":
          description: Muted words
          content:
            application/json:
              schema:
                type: object
                required: [words, limit]
                properties:
                  words: { type: array, items: { $ref: "#/components/schemas/MutedWord" } }
                  limit: { type: integer }
    post:
      operationId: addMutedWord
      tags: [safety]
      summary: Mute a word, phrase, #hashtag or @handle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutedWordInput" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/MutedWord" } } } }
        "409": { description: Limit reached }

  /safety/muted-words/{phrase}:
    parameters:
      - { name: phrase, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeMutedWord
      tags: [safety]
      summary: Unmute a word or phrase
      responses:
        "200": { description: Removed, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }

  /social/blocks:
    get:
      operationId: listBlockedAccounts
      tags: [safety]
      summary: Accounts I have blocked
      responses:
        "200":
          description: Blocked accounts, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BlockedAccount" } }

  /social/block:
    post:
      operationId: blockAccount
      tags: [safety]
      summary: Block someone. Hides both people from each other and stops messages and comments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockAccountInput" }
      responses:
        "200": { description: Blocked, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }

  /social/block/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unblockAccount
      tags: [safety]
      summary: Unblock someone
      responses:
        "200": { description: Unblocked, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }

  # ── Account controls (App Store 5.1.1(v)) ───────────────────────────────────

  /auth/account/deletion-check:
    get:
      operationId: getAccountDeletionCheck
      tags: [account]
      summary: What deletion removes, what is retained, and anything that must be settled first
      responses:
        "200":
          description: Eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionCheck" }

  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the account, its data, and the Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountInput" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "409":
          description: Open orders, held funds or disputes must be settled first
          content:
            application/json:
              schema:
                type: object
                required: [error, code, blockers]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [DELETION_BLOCKED] }
                  blockers: { type: array, items: { $ref: "#/components/schemas/DeletionBlocker" } }

  /auth/legal-acceptance:
    post:
      operationId: acceptLegalTerms
      tags: [account]
      summary: Record agreement to the Terms, Community Guidelines and Privacy Policy version shown
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalAcceptanceInput" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [termsVersion, termsAcceptedAt]
                properties:
                  termsVersion: { type: string }
                  termsAcceptedAt: { type: string, format: date-time }

  /auth/sessions:
    get:
      operationId: listAccountSessions
      tags: [account]
      summary: Active Clerk sessions with device and approximate location
      responses:
        "200":
          description: Sessions, current first
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/AccountSession" } }

  /auth/sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeAccountSession
      tags: [account]
      summary: Sign out one device
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeSessionsResult" } } } }

  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherAccountSessions
      tags: [account]
      summary: Sign out every device except this one
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeSessionsResult" } } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CallTokenInput:
      type: object
      required: [conversationId, mode]
      properties:
        conversationId: { type: string }
        threadId: { type: string }
        mode: { type: string, enum: [voice, video] }

    CallTokenRenewalInput:
      type: object
      required: [threadId, mode, clientRenewalId]
      properties:
        threadId: { type: string, format: uuid }
        mode: { type: string, enum: [voice, video] }
        clientRenewalId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"

    CallCredentials:
      type: object
      required: [appId, token, channelName, uid, mode, expiresAt]
      properties:
        appId: { type: string }
        token: { type: string }
        channelName: { type: string }
        uid: { type: integer, minimum: 1 }
        mode: { type: string, enum: [voice, video] }
        expiresAt: { type: string, format: date-time }

    DropBroadcastPreview:
      type: object
      required: [followers]
      properties:
        followers: { type: integer, minimum: 0 }

    # ── Manufacturer ─────────────────────────────────────────────────────────────

    Manufacturer:
      type: object
      required: [id, clerkId, businessName, country, specialty, moq, priceRange, bulkTurnaround, sampleTurnaround, status, createdAt, updatedAt, revision]
      properties:
        id:               { type: string }
        clerkId:          { type: string }
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: ["string", "null"] }
        specialty:        { type: string }
        description:      { type: ["string", "null"] }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        photos:
          type: array
          items: { type: string, format: uri }
        website:          { type: ["string", "null"] }
        contactEmail:     { type: ["string", "null"] }
        contactPhone:     { type: ["string", "null"] }
        status:           { type: string }
        verifiedAt:       { type: ["string", "null"] }
        paymentSetup:     { type: boolean }
        createdAt:        { type: string }
        updatedAt:        { type: string }
        revision:         { type: integer, minimum: 1 }

    ManufacturerInput:
      type: object
      required: [businessName, country, specialty, moq, priceRange, bulkTurnaround, sampleTurnaround]
      properties:
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: string }
        specialty:        { type: string }
        description:      { type: string }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        website:          { type: string }
        contactEmail:     { type: string }
        contactPhone:     { type: string }

    ManufacturerUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        businessName:     { type: string }
        country:          { type: string }
        city:             { type: string }
        specialty:        { type: string }
        description:      { type: string }
        yearsInBusiness:  { type: integer }
        moq:              { type: integer }
        priceRange:       { type: string }
        bulkTurnaround:   { type: string }
        sampleTurnaround: { type: string }
        website:          { type: string }
        contactEmail:     { type: string }
        contactPhone:     { type: string }

    ManufacturerPhotoReorder:
      type: object
      required: [expectedRevision, photoOrder]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        photoOrder:
          type: array
          description: Complete zero-based permutation of the current photo list; index zero becomes the lead image.
          items: { type: integer }
          uniqueItems: true

    ManufacturerPhotoDelete:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }

    PublicManufacturer:
      type: object
      additionalProperties: false
      required: [id, businessName, country, specialty, yearsInBusiness, moq, priceRange, bulkTurnaround, sampleTurnaround, photos, isVerified, createdAt, updatedAt, revision]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        country: { type: string }
        city: { type: ["string", "null"] }
        specialty: { type: string }
        description: { type: ["string", "null"] }
        yearsInBusiness: { type: integer }
        moq: { type: integer }
        priceRange: { type: string }
        bulkTurnaround: { type: string }
        sampleTurnaround: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
        website: { type: ["string", "null"] }
        isVerified: { type: boolean }
        rating: { type: ["number", "null"] }
        responseTime: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }

    ManufacturerApplicationInput:
      allOf:
        - $ref: "#/components/schemas/ManufacturerInput"
        - type: object
          required: [clientRequestId]
          properties:
            clientRequestId: { type: string, minLength: 1, maxLength: 100 }

    ManufacturerApplicationReceipt:
      type: object
      required: [id, status, published]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        published: { type: boolean, const: false }

    ManufacturerRelationshipInput:
      type: object
      required: [manufacturerId]
      properties:
        manufacturerId: { type: string, format: uuid }

    ManufacturerRelationship:
      type: object
      required: [id, sellerId, manufacturerId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string }
        manufacturerId: { type: string, format: uuid }
        status: { type: string, enum: [active, blocked, ended] }
        manufacturer: { $ref: "#/components/schemas/PublicManufacturer" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ManufacturerThreadInput:
      type: object
      required: [manufacturerId]
      properties:
        manufacturerId: { type: string, format: uuid }
        subject: { type: string, maxLength: 200 }

    ManufacturerDashboard:
      type: object
      required: [activeOrders, pendingMessages, completedOrders, totalRevenueCents, recentOrders, activeSellers, messages, sampleOrders, bulkOrders, orderHistory]
      properties:
        activeOrders:        { type: integer }
        pendingMessages:     { type: integer }
        completedOrders:     { type: integer }
        totalRevenueCents:   { type: integer }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/SampleOrder"
        activeSellers:
          type: array
          items: { type: object, additionalProperties: true }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageThread" }
        sampleOrders: { $ref: "#/components/schemas/OrderBuckets" }
        bulkOrders: { $ref: "#/components/schemas/OrderBuckets" }
        orderHistory:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }

    # ── Messages ──────────────────────────────────────────────────────────────────

    MessageThread:
      type: object
      required: [id, manufacturerId, sellerId, buyerName, subject, lastMessage, lastMessageAt, unreadCount]
      properties:
        id:             { type: string }
        manufacturerId: { type: string, format: uuid }
        sellerId:       { type: string }
        buyerName:      { type: string }
        buyerAvatar:    { type: ["string", "null"] }
        subject:        { type: string }
        lastMessage:    { type: string }
        lastMessageAt:  { type: string }
        unreadCount:    { type: integer }
        orderStatus:    { type: ["string", "null"] }

    Message:
      type: object
      required: [id, threadId, senderRole, senderId, content, messageType, mediaUrls, sentAt]
      properties:
        id:          { type: string }
        threadId:    { type: string }
        senderRole:  { type: string }
        senderId:    { type: string }
        content:     { type: string }
        messageType: { type: string, enum: [text, image, sample_card, bulk_card, system] }
        mediaUrls: { type: array, items: { type: string } }
        cardData: { type: ["object", "null"], additionalProperties: true }
        sentAt:      { type: string }

    MessageInput:
      type: object
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string }
        messageType: { type: string, enum: [text, image, sample_card, bulk_card, system] }
        mediaUrls:
          type: array
          items: { type: string }
        cardData: { type: ["object", "null"], additionalProperties: true }

    AttachmentReceipt:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, pattern: "^/objects/" }

    # ── Orders ────────────────────────────────────────────────────────────────────

    SampleOrder:
      type: object
      additionalProperties: true
      required: [id, manufacturerId, sellerId, orderType, title, quantity, priceCents, status, createdAt, updatedAt, revision]
      properties:
        id: { type: string }
        manufacturerId: { type: string }
        sellerId: { type: string }
        threadId: { type: ["string", "null"] }
        orderType: { type: string, enum: [sample, bulk] }
        title: { type: string }
        quantity: { type: integer }
        priceCents: { type: integer }
        status: { type: string }
        imageUrls:
          type: array
          description: Short-lived display URLs returned only to an authorized order participant; private object paths are never returned by detail endpoints.
          items: { type: string, format: uri }
        createdAt: { type: string }
        updatedAt: { type: string }
        revision: { type: integer, minimum: 1 }

    ProductionOrderInput:
      type: object
      required: [clientRequestId, manufacturerId, orderType, title, quantity, priceCents]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 100 }
        manufacturerId: { type: string, format: uuid }
        threadId: { type: ["string", "null"], format: uuid }
        orderType: { type: string, enum: [sample, bulk] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
        quantity: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }

    SampleDetailDecisionInput:
      type: object
      required: [status, expectedRevision]
      properties:
        status: { type: string, enum: [approved, rejected, revision_requested] }
        expectedRevision: { type: integer, minimum: 1 }
        review: { type: object, additionalProperties: true }
        revision: { type: object, additionalProperties: true }

    SampleOrderImageUploadReceipt:
      type: object
      required: [imageUrls, revision]
      properties:
        imageUrls:
          type: array
          items: { type: string, format: uri }
        revision: { type: integer, minimum: 1 }

    OrderBuckets:
      type: object
      required: [active, completed]
      properties:
        active:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/SampleOrder" }

    ManufacturerSampleOrderStatusUpdate:
      type: object
      required: [status, expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        status: { type: string, enum: [processing, cut_and_sew, packing, shipped, delivered] }
        trackingNumber: { type: string }
        carrier: { type: string }

    SampleCheckoutSession:
      type: object
      required: [sessionId, paymentStatus]
      properties:
        sessionId: { type: string }
        url: { type: ["string", "null"] }
        paymentStatus: { type: string }

    SampleCheckoutSessionInput:
      type: object
      required: [returnUrl]
      properties: { returnUrl: { type: string } }

    BulkWalletPaymentInput:
      type: object
      required: [walletId]
      properties: { walletId: { type: string } }

    BulkPaymentOptions:
      type: object
      required: [orderId, requiredCents, wallets]
      properties:
        orderId: { type: string }
        requiredCents: { type: integer }
        wallets:
          type: array
          items:
            type: object
            required: [id, dropId, availableCents, eligible]
            properties:
              id: { type: string }
              dropId: { type: string }
              availableCents: { type: integer }
              eligible: { type: boolean }

    # ── Payment ───────────────────────────────────────────────────────────────────

    ManufacturerPayment:
      type: object
      required: [isSetup, method]
      properties:
        isSetup:     { type: boolean }
        method:      { type: ["string", "null"] }
        bankLast4:   { type: ["string", "null"] }
        bankName:    { type: ["string", "null"] }
        currency:    { type: ["string", "null"] }
        setupAt:     { type: ["string", "null"] }

    ManufacturerPaymentInput:
      type: object
      required: [method, accountNumber, routingNumber, bankName, currency]
      properties:
        method:        { type: string }
        accountNumber: { type: string }
        routingNumber: { type: string }
        bankName:      { type: string }
        currency:      { type: string }
        paypalEmail:   { type: string }
        wiseEmail:     { type: string }

    ManufacturerConnectStatus:
      type: object
      required: [connected, ready, status, chargesEnabled, payoutsEnabled, detailsSubmitted, requirementsDue]
      properties:
        connected: { type: boolean }
        ready: { type: boolean }
        status: { type: string, enum: [not_started, pending, restricted, active] }
        stripeAccountId: { type: string }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        detailsSubmitted: { type: boolean }
        requirementsDue: { type: array, items: { type: string } }
        disabledReason: { type: ["string", "null"] }
        recovery: { type: ["string", "null"] }

    ManufacturerConnectOnboardingInput:
      type: object
      required: [refreshUrl, returnUrl]
      properties:
        refreshUrl: { type: string, format: uri }
        returnUrl: { type: string, format: uri }

    ManufacturerConnectOnboarding:
      type: object
      required: [url, stripeAccountId]
      properties:
        url: { type: string, format: uri }
        stripeAccountId: { type: string }

    ManufacturerPaymentActivity:
      type: object
      required: [id, manufacturerId, category, type, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        manufacturerId: { type: string, format: uuid }
        sampleOrderId: { type: ["string", "null"], format: uuid }
        category: { type: string, enum: [payment, payout] }
        type: { type: string }
        amountCents: { type: ["integer", "null"] }
        orderTitle: { type: ["string", "null"] }
        orderType: { type: ["string", "null"], enum: [sample, bulk, null] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    # ── Trust & safety ───────────────────────────────────────────────────────────

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ProfileSummary:
      type: object
      required: [userId, name, handle, initials, suspended, deleted]
      properties:
        userId: { type: string }
        name: { type: string }
        handle: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }
        accountType: { type: ["string", "null"] }
        suspended: { type: boolean }
        deleted: { type: boolean }

    Comment:
      type: object
      required: [id, postId, parentId, body, createdAt, author, likesCount, likedByMe, isMine, canDelete, pendingReview, replies]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        parentId: { type: ["string", "null"], format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/ProfileSummary" }
        likesCount: { type: integer, minimum: 0 }
        likedByMe: { type: boolean }
        isMine: { type: boolean }
        canDelete: { type: boolean }
        pendingReview:
          type: boolean
          description: Held by the content filter; only the author can see it until a moderator reviews it.
        replies: { type: array, items: { $ref: "#/components/schemas/Comment" } }

    CommentThread:
      type: object
      required: [comments, total, hiddenByMutedWords, commentsDisabled, canComment, nextCursor]
      properties:
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        total: { type: integer, minimum: 0 }
        hiddenByMutedWords: { type: integer, minimum: 0 }
        commentsDisabled: { type: boolean }
        canComment: { type: boolean }
        nextCursor: { type: ["string", "null"], format: date-time }

    CreateCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
        parentId: { type: ["string", "null"], format: uuid }

    CreatedComment:
      type: object
      required: [comment, moderation]
      properties:
        comment: { $ref: "#/components/schemas/Comment" }
        moderation:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [visible, held] }
            message: { type: string }

    ContentRejected:
      type: object
      required: [error, category, code]
      properties:
        error: { type: string }
        category: { type: string, enum: [spam_scam, explicit_sexual, harassment, hate_speech, profanity, abuse] }
        code: { type: string, enum: [CONTENT_REJECTED] }

    ReportTargetType:
      type: string
      enum: [post, video, live, live_comment, comment, story, product, profile, message]

    ReportReason:
      type: string
      enum: [spam, harassment, nudity, hate, violence, ip_counterfeit, scam, other]

    CreateReportInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: "#/components/schemas/ReportTargetType" }
        targetId: { type: string }
        reason: { $ref: "#/components/schemas/ReportReason" }
        note:
          type: string
          maxLength: 1000
          description: Required when reason is "other".

    Report:
      type: object
      required: [id, targetType, targetId, reason, status, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string }
        targetId: { type: string }
        targetLabel: { type: ["string", "null"] }
        targetOwnerId: { type: ["string", "null"] }
        contentExcerpt: { type: ["string", "null"] }
        reason: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [pending, reviewed, actioned, dismissed] }
        source: { type: string, enum: [user, auto_filter] }
        createdAt: { type: string, format: date-time }

    ModerationQueueItem:
      type: object
      required: [id, status, source, targetType, targetId, reason, createdAt, openReportsOnTarget, ownerPriorActions]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, reviewed, actioned, dismissed] }
        source: { type: string, enum: [user, auto_filter] }
        targetType: { type: string }
        targetId: { type: string }
        targetLabel: { type: ["string", "null"] }
        contentExcerpt: { type: ["string", "null"] }
        reason: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        resolution:
          type: ["object", "null"]
          properties:
            action: { type: ["string", "null"] }
            note: { type: ["string", "null"] }
            resolvedAt: { type: ["string", "null"], format: date-time }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/ProfileSummary" }
            - { type: "null" }
        reporter:
          oneOf:
            - { $ref: "#/components/schemas/ProfileSummary" }
            - { type: "null" }
        openReportsOnTarget: { type: integer, minimum: 0 }
        ownerPriorActions: { type: integer, minimum: 0 }

    ModerationQueue:
      type: object
      required: [items, hasMore, summary]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModerationQueueItem" } }
        hasMore: { type: boolean }
        summary:
          type: object
          required: [open, heldByFilter, resolvedToday]
          properties:
            open: { type: integer }
            heldByFilter: { type: integer }
            resolvedToday: { type: integer }

    ResolveReportInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [dismiss, remove_content, suspend_user] }
        note: { type: string, maxLength: 1000 }

    ResolveReportResult:
      type: object
      required: [ok, status, action, resolvedReports, signedOut]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [dismissed, actioned] }
        action: { type: string, enum: [dismiss, remove_content, suspend_user] }
        resolvedReports: { type: integer, minimum: 1 }
        suspendedUserId: { type: ["string", "null"] }
        signedOut: { type: boolean }

    MutedWord:
      type: object
      required: [phrase, createdAt]
      properties:
        phrase: { type: string }
        createdAt: { type: string, format: date-time }

    BlockedAccount:
      type: object
      required: [userId, name, handle, initials, color, blockedAt]
      properties:
        userId: { type: string }
        name: { type: string }
        handle: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }
        accountType: { type: ["string", "null"] }
        color: { type: string }
        blockedAt: { type: string, format: date-time }

    # ── Account controls ─────────────────────────────────────────────────────────

    DeletionBlocker:
      type: object
      required: [code, title, detail, count, amountCents, actionRoute, actionLabel]
      properties:
        code:
          type: string
          enum:
            - seller_open_orders
            - seller_held_funds
            - seller_reserved_label_funds
            - seller_open_returns
            - seller_open_disputes
            - seller_payout_in_flight
            - buyer_orders_awaiting_shipment
        title: { type: string }
        detail: { type: string }
        count: { type: integer, minimum: 0 }
        amountCents: { type: ["integer", "null"] }
        actionRoute: { type: string }
        actionLabel: { type: string }

    AccountDeletionCheck:
      type: object
      required: [canDelete, accountType, blockers, willDelete, willRetain]
      properties:
        canDelete: { type: boolean }
        accountType: { type: ["string", "null"] }
        blockers: { type: array, items: { $ref: "#/components/schemas/DeletionBlocker" } }
        willDelete: { type: array, items: { type: string } }
        willRetain: { type: array, items: { type: string } }

    AccountSession:
      type: object
      required: [id, current, status, device, isMobile, lastActiveAt, createdAt]
      properties:
        id: { type: string }
        current: { type: boolean }
        status: { type: string }
        device: { type: string }
        browser: { type: ["string", "null"] }
        isMobile: { type: boolean }
        location: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RevokeSessionsResult:
      type: object
      required: [ok, revoked]
      properties:
        ok: { type: boolean }
        revoked: { type: integer, minimum: 0 }

    LikeCommentInput:
      type: object
      required: [liked]
      properties:
        liked: { type: boolean }

    MutedWordInput:
      type: object
      required: [phrase]
      properties:
        phrase: { type: string, minLength: 1, maxLength: 60 }

    BlockAccountInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    DeleteAccountInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: [DELETE] }

    LegalAcceptanceInput:
      type: object
      required: [version]
      properties:
        version: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}(\\.[0-9]+)?$" }
